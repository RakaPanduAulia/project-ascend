<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ascend</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">

    <!-- Header: nama app + Day counter + streak + level + EXP bar -->
    <header class="header">
      <div class="top-bar">
        <div class="brand">ASCEND</div>
        <div class="chips">
          <div class="poin-chip" id="poin-label">💎 0</div>
          <div class="streak-chip" id="streak-label">🔥 0</div>
        </div>
      </div>
      <div class="day-counter">
        <span id="day-label">DAY 1</span>
        <span id="day-total">/ 66</span>
      </div>
      <div class="level-row">
        <span id="level-label">Lv. 1</span>
        <span id="exp-label">0 / 100 EXP</span>
      </div>
      <div class="exp-track">
        <div class="exp-fill" id="exp-fill"></div>
      </div>
    </header>

    <!-- Ringkasan hari: status cepat (misi kelar + target gizi) -->
    <div class="day-summary" id="day-summary"></div>

    <!-- Stat -->
    <section class="section">
      <h2 class="day-title" style="margin-top:0;">📊 Stat</h2>
      <div class="stat-list" id="stat-list"></div>
    </section>

    <!-- Pemantauan Gizi harian -->
    <section class="section">
      <h2 class="day-title" style="margin-top:0;">🍎 Gizi Hari Ini</h2>
      <div class="gizi-list" id="gizi-list"></div>
    </section>

    <!-- Misi -->
    <section class="section">
      <h2 class="day-title" style="margin-top:0;">🗺️ Misi Hari Ini</h2>
      <div class="mission-list" id="mission-list"></div>
      <div class="pep-talk" id="pep-talk"></div>
    </section>

    <!-- Skill tree -->
    <section class="section">
      <div class="ach-head">
        <h2 class="day-title" style="margin-top:0;margin-bottom:0;">⚔️ Skill</h2>
        <span class="ach-count" id="skill-count">0 / 5</span>
      </div>
      <div class="skill-list" id="skill-list"></div>
    </section>

    <!-- Shop -->
    <section class="section">
      <h2 class="day-title" style="margin-top:0;">🛒 Shop</h2>
      <div class="shop-list" id="shop-list"></div>
    </section>

    <!-- Achievements -->
    <section class="section">
      <div class="ach-head">
        <h2 class="day-title" style="margin-top:0;margin-bottom:0;">🏆 Achievements</h2>
        <span class="ach-count" id="achievement-count">0 / 8</span>
      </div>
      <div class="achievement-grid" id="achievement-grid"></div>
    </section>

    <!-- Riwayat -->
    <section class="section">
      <h2 class="day-title" style="margin-top:0;">📒 Riwayat</h2>
      <div class="history-list" id="history-list"></div>
    </section>

  </div>

  <!-- Notifikasi kecil pas badge kebuka -->
  <div class="toast" id="toast"></div>

  <!-- Overlay animasi "LEVEL UP!" yang lebih wah -->
  <div class="levelup-overlay" id="levelup">
    <div class="flash"></div>
    <div class="burst" id="burst"></div>
    <div class="levelup-card">
      <div class="text">LEVEL UP!</div>
      <div class="sub" id="levelup-sub">Lv. 2</div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
