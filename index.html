<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ascend</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">

    <!-- Header: nama app + Day counter + streak + level + EXP bar -->
    <header class="header">
      <div class="top-bar">
        <div class="brand">ASCEND</div>
        <div class="streak-chip" id="streak-label">🔥 0</div>
      </div>
      <div class="day-counter">
        <span id="day-label">DAY 1</span>
        <span id="day-total">/ 66</span>
      </div>
      <div class="level-row">
        <span id="level-label">Lv. 1</span>
        <span id="exp-label">0 / 100 EXP</span>
      </div>
      <div class="exp-track">
        <div class="exp-fill" id="exp-fill"></div>
      </div>
    </header>

    <!-- Stat: Body / Mind / Looks / Discipline (diisi oleh JavaScript) -->
    <div class="stat-list" id="stat-list"></div>

    <!-- Judul hari -->
    <h2 class="day-title">🗺️ Misi Hari Ini</h2>

    <!-- Daftar misi diisi otomatis oleh JavaScript -->
    <div class="mission-list" id="mission-list"></div>

    <!-- Pesan motivasi -->
    <div class="pep-talk" id="pep-talk"></div>

    <!-- Riwayat hari-hari sebelumnya -->
    <h2 class="day-title" style="margin-top:28px;">📒 Riwayat</h2>
    <div class="history-list" id="history-list"></div>

    <!-- Tombol reset: balikin ke Level 1 buat testing -->
    <button class="reset-btn" id="reset-btn">🔄 Reset ke Level 1</button>

  </div>

  <!-- Overlay animasi "LEVEL UP!" yang lebih wah -->
  <div class="levelup-overlay" id="levelup">
    <div class="flash"></div>
    <div class="burst" id="burst"></div>
    <div class="levelup-card">
      <div class="text">LEVEL UP!</div>
      <div class="sub" id="levelup-sub">Lv. 2</div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
