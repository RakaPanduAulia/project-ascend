<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ascend</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">

    <!-- ============ HALAMAN: HOME ============ -->
    <div class="page active" id="page-home">
      <!-- Header: nama app + poin + streak + Day + EXP bar -->
      <header class="header">
        <div class="top-bar">
          <div class="brand">ASCEND</div>
          <div class="chips">
            <div class="poin-chip" id="poin-label">💎 0</div>
            <div class="streak-chip" id="streak-label">🔥 0</div>
          </div>
        </div>
        <div class="day-counter">
          <span id="day-label">DAY 1</span>
          <span id="day-total">/ 66</span>
        </div>
        <div class="level-row">
          <span id="level-label">Lv. 1</span>
          <span id="exp-label">0 / 100 EXP</span>
        </div>
        <div class="exp-track">
          <div class="exp-fill" id="exp-fill"></div>
        </div>
      </header>

      <!-- 4 Stat -->
      <section class="section">
        <h2 class="day-title" style="margin-top:0;">📊 Stat</h2>
        <div class="stat-list" id="stat-list"></div>
      </section>

      <!-- Misi utama -->
      <section class="section">
        <h2 class="day-title" style="margin-top:0;">🗺️ Misi Hari Ini</h2>
        <div class="mission-list" id="mission-list"></div>
        <div class="pep-talk" id="pep-talk"></div>
      </section>
    </div>

    <!-- ============ HALAMAN: GIZI ============ -->
    <div class="page" id="page-gizi">
      <h1 class="page-title">🍎 Gizi Hari Ini</h1>
      <section class="section">
        <div class="gizi-list" id="gizi-list"></div>
      </section>
    </div>

    <!-- ============ HALAMAN: SKILL ============ -->
    <div class="page" id="page-skill">
      <h1 class="page-title">⚔️ Skill <span class="ach-count" id="skill-count">0 / 5</span></h1>
      <section class="section">
        <div class="skill-list" id="skill-list"></div>
      </section>
    </div>

    <!-- ============ HALAMAN: SHOP ============ -->
    <div class="page" id="page-shop">
      <h1 class="page-title">🛒 Shop</h1>
      <section class="section">
        <div class="shop-list" id="shop-list"></div>
      </section>
    </div>

    <!-- ============ HALAMAN: LAINNYA (Grafik + Achievement + Riwayat) ============ -->
    <div class="page" id="page-more">
      <h1 class="page-title">📈 Progres</h1>
      <section class="section">
        <div class="chart-box" id="chart-box"></div>
      </section>
      <h1 class="page-title" style="margin-top:22px;">🏆 Achievements <span class="ach-count" id="achievement-count">0 / 8</span></h1>
      <section class="section">
        <div class="achievement-grid" id="achievement-grid"></div>
      </section>
      <h1 class="page-title" style="margin-top:22px;">📒 Riwayat</h1>
      <section class="section">
        <div class="history-list" id="history-list"></div>
      </section>
    </div>

  </div>

  <!-- ============ NAV BAR BAWAH ============ -->
  <nav class="navbar" id="navbar">
    <button class="nav-btn active" data-page="home"><span class="nav-ico">🏠</span><span>Home</span></button>
    <button class="nav-btn" data-page="gizi"><span class="nav-ico">🍎</span><span>Gizi</span></button>
    <button class="nav-btn" data-page="skill"><span class="nav-ico">⚔️</span><span>Skill</span></button>
    <button class="nav-btn" data-page="shop"><span class="nav-ico">🛒</span><span>Shop</span></button>
    <button class="nav-btn" data-page="more"><span class="nav-ico">🏆</span><span>Lainnya</span></button>
  </nav>

  <!-- Notifikasi kecil pas badge kebuka -->
  <div class="toast" id="toast"></div>

  <!-- Overlay animasi "LEVEL UP!" yang lebih wah -->
  <div class="levelup-overlay" id="levelup">
    <div class="flash"></div>
    <div class="burst" id="burst"></div>
    <div class="levelup-card">
      <div class="text">LEVEL UP!</div>
      <div class="sub" id="levelup-sub">Lv. 2</div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
